<div>
    <div>
        <form class="person-search-form" [formGroup]="searchForm" (ngSubmit)="onSubmit()">
            <input placeholder="Person" type="text" id="term" name="term" autocomplete="off" formControlName="term">
            <select name="color" id="color" formControlName="color">
                <option value="">Select Color</option>
                <option value="blue">Blue</option>
                <option value="red">Red</option>
                <option value="green">Green</option>
            </select>
            <button type="submit">Search</button>
        </form>
    </div>

    <h2 class="results-title">Search Results</h2>

    <div class="feedback-message" aria-live="polite">
        <span *ngIf="feedbackMessage" >{{ feedbackMessage }}</span>
    </div>

    <!-- Search result cards -->
    <div class="search-results" *ngIf="people.length > 0">
        <div *ngFor="let person of people">
            <app-result-card [person]="person"></app-result-card>
        </div>
    </div>
</div>
